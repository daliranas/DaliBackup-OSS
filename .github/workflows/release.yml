name: Release & Distribution Engine

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-hyperv-agent-exe:
    name: Build self-contained Hyper-V agent executable
    runs-on: windows-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🪟 Build single-file Hyper-V executable
        shell: pwsh
        run: |
          ./agents/hyperv/Build-StandaloneExe.ps1 -OutputPath ./DaliBackup-HyperV-Agent.exe

      - name: 📤 Upload Hyper-V executable
        uses: actions/upload-artifact@v4
        with:
          name: dalibackup-hyperv-exe
          path: DaliBackup-HyperV-Agent.exe
          if-no-files-found: error

  build-and-publish-release:
    name: Build & Package Release Assets
    needs: build-hyperv-agent-exe
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22.x LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: Validate release tag and prepare changelog
        shell: bash
        run: |
          VERSION="v$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "$VERSION"
          awk -v version="$VERSION" '
            /^## / { if (found) exit; if ($2 == version) found=1 }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: 🔨 Compile Production TypeScript (tsc)
        run: npm run build

      - name: 🧪 Execute Full Test Suite Verification
        run: npm test

      - name: 📥 Download self-contained Hyper-V executable
        uses: actions/download-artifact@v4
        with:
          name: dalibackup-hyperv-exe
          path: release-assets/hyperv-exe

      - name: 📦 Package Distribution Assets & Compute Checksums
        run: |
          mkdir -p release-assets
          VERSION="${GITHUB_REF_NAME:-v1.0.0}"

          # 1. Single-file Hyper-V executable and optional source package.
          mv release-assets/hyperv-exe/DaliBackup-HyperV-Agent.exe "release-assets/DaliBackup-HyperV-Agent-${VERSION}.exe"
          zip -j "release-assets/dalibackup-hyperv-agents-${VERSION}.zip" agents/hyperv/*.ps1 agents/hyperv/config.example.json agents/hyperv/README.md

          # 2. Proxmox Hook Tarball
          tar -czvf "release-assets/dalibackup-proxmox-hooks-${VERSION}.tar.gz" -C agents/proxmox .

          # 3. Full Standalone Production Server Tarball
          tar -czvf "release-assets/dalibackup-oss-server-${VERSION}.tar.gz" dist public agents package.json package-lock.json tsconfig.json docker-compose.yml Dockerfile .env.example LICENSE NOTICE README.md CHANGELOG.md docs

          # 4. Generate SHA-256 Checksums
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cd ..

      - name: 🚀 Publish GitHub Official Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          name: "DaliBackup-OSS ${{ github.ref_name }} — Sovereign Backup Engine"
          body_path: release-notes.md
          draft: false
          prerelease: false
